services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sbom
      POSTGRES_PASSWORD: sbom
      POSTGRES_DB: sbom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbom"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
